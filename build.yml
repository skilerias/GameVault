name: Build GameVault Installer

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

# Needed so the "Publish GitHub Release" step below is allowed to create a
# release and upload the installer to it.
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install flask requests pywebview psutil icoextract pillow pywin32 pyinstaller

      - name: Create icon
        run: python make_icon.py

      # Single source of truth for the version: the VERSION file at the repo
      # root. Bump it before pushing to main to ship a new release -- this
      # same number becomes the installer version AND the release tag, and
      # it's what's bundled into the app for GameVault_app.py's own
      # check_for_update() to compare itself against next time.
      - name: Read app version
        id: appver
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            Write-Error "VERSION file must look like 1.2.3 (got '$version')"
            exit 1
          }
          echo "version=$version" >> $env:GITHUB_OUTPUT
          echo "tag=v$version" >> $env:GITHUB_OUTPUT

      - name: Build with PyInstaller (onedir)
        run: >
          pyinstaller --noconfirm --clean --onedir --windowed
          --name GameVault
          --icon=icon.ico
          --add-data "VERSION;."
          --hidden-import=win32com.client
          --hidden-import=pythoncom
          --hidden-import=pywintypes
          --collect-all webview
          GameVault_app.py

      # Fail the build if VERSION didn't make it into the bundle -- otherwise
      # the app ships showing 0.0.0 and in-app updates never work.
      - name: Verify VERSION is bundled
        shell: pwsh
        run: |
          if (-not ((Test-Path "dist/GameVault/_internal/VERSION") -or (Test-Path "dist/GameVault/VERSION"))) {
            Write-Error "VERSION was not bundled into dist/GameVault"
            exit 1
          }
          Get-ChildItem -Recurse dist/GameVault -Filter VERSION | ForEach-Object { Write-Host "Found: $($_.FullName)" }

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Build installer with Inno Setup
        run: |
          mkdir installer
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=${{ steps.appver.outputs.version }}" "GameVault.iss"

      - name: Upload installer as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: GameVault_Setup
          path: installer\GameVault_Setup.exe

      # If VERSION wasn't bumped since the last release (e.g. a push that
      # only touched something else, or a re-run), a release for this tag
      # already exists -- skip publishing again instead of erroring out or
      # silently overwriting it.
      - name: Check if this version was already released
        id: check_release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${{ steps.appver.outputs.tag }}" --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) {
            echo "exists=true" >> $env:GITHUB_OUTPUT
          } else {
            echo "exists=false" >> $env:GITHUB_OUTPUT
          }

      # This is what GameVault_app.py's check_for_update() actually polls
      # (GitHub Releases API, "latest"), and what it downloads the .exe
      # from -- an artifact upload alone is not enough for in-app updates.
      - name: Publish GitHub Release
        if: steps.check_release.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.appver.outputs.tag }}
          name: GameVault ${{ steps.appver.outputs.version }}
          generate_release_notes: true
          files: installer/GameVault_Setup.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
