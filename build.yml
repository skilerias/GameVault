name: Build GameVault Installer

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

# Needed so the workflow can commit the bumped VERSION file back to the repo
# and publish a GitHub Release.
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install flask requests pywebview psutil icoextract pillow pywin32 pyinstaller

      - name: Create icon
        run: python make_icon.py

      # ---- Auto version bump ----
      # 0.0.1 -> 0.0.2 -> ... -> 0.0.21 -> 1.1.0 -> 1.1.1 -> ... -> 1.1.21
      # -> 1.2.0 -> 1.2.1 -> ... -> 1.2.21 -> 1.3.0 -> and so on.
      # Once major is 1+, patch cycles 0..21 and minor goes up by 1 every
      # time patch wraps back to 0. Major only ever jumps 0 -> 1, once.
      - name: Bump VERSION
        run: |
          $content = (Get-Content VERSION -Raw).Trim()
          $parts = $content.Split('.')
          [int]$major = $parts[0]; [int]$minor = $parts[1]; [int]$patch = $parts[2]

          if ($major -eq 0) {
            if ($patch -lt 21) { $patch++ }
            else { $major = 1; $minor = 1; $patch = 0 }
          } else {
            if ($patch -lt 21) { $patch++ }
            else { $patch = 0; $minor++ }
          }

          $newVersion = "$major.$minor.$patch"
          Set-Content -Path VERSION -Value $newVersion -NoNewline
          Write-Host "New version: $newVersion"
          echo "APPVER=$newVersion" >> $env:GITHUB_ENV

      # Save the bumped VERSION back to the repo so the next run starts
      # from the right number. "[skip ci]" stops this commit from
      # triggering the workflow again (infinite loop).
      - name: Commit bumped VERSION back to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add VERSION
          git commit -m "Bump version to $env:APPVER [skip ci]"
          git push

      - name: Build with PyInstaller (onedir)
        run: >
          pyinstaller --noconfirm --clean --onedir --windowed
          --name GameVault
          --icon=icon.ico
          --add-data "VERSION;."
          --hidden-import=win32com.client
          --hidden-import=pythoncom
          --hidden-import=pywintypes
          --collect-all webview
          GameVault_app.py

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Build installer with Inno Setup
        run: |
          mkdir installer
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$env:APPVER" "GameVault.iss"

      - name: Upload installer as artifact
        uses: actions/upload-artifact@v4
        with:
          name: GameVault_Setup
          path: installer\GameVault_Setup.exe

      # This is the part your in-app "Check for updates" actually reads --
      # it looks at GitHub Releases, not at workflow artifacts.
      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v$env:APPVER" "installer\GameVault_Setup.exe" --title "GameVault v$env:APPVER" --notes "Automated build"
