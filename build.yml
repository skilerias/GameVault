name: Build GameVault Installer

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

# Needed so the "Publish GitHub Release" step below is allowed to create a
# release and upload the installer to it, and so the version-bump step can
# push the updated VERSION file back to the repo.
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install flask requests pywebview psutil icoextract pillow pywin32 pyinstaller

      - name: Create icon
        run: python make_icon.py

      # ---- Auto version bump ----
      # 0.0.1 -> 0.0.2 -> ... -> 0.0.21 -> 1.1.0 -> 1.1.1 -> ... -> 1.1.21
      # -> 1.2.0 -> 1.2.1 -> ... -> 1.2.21 -> 1.3.0 -> and so on.
      # Once major is 1+, patch cycles 0..21 and minor goes up by 1 every
      # time patch wraps back to 0. Major only ever jumps 0 -> 1, once.
      # This is the single source of truth: the VERSION file at the repo
      # root gets bumped here every run, then becomes the installer version
      # AND the release tag, and it's what's bundled into the app for
      # GameVault_app.py's own check_for_update() to compare against.
      - name: Bump VERSION
        id: appver
        shell: pwsh
        run: |
          $content = (Get-Content VERSION -Raw).Trim()
          $parts = $content.Split('.')
          [int]$major = $parts[0]; [int]$minor = $parts[1]; [int]$patch = $parts[2]

          if ($major -eq 0) {
            if ($patch -lt 21) { $patch++ }
            else { $major = 1; $minor = 1; $patch = 0 }
          } else {
            if ($patch -lt 21) { $patch++ }
            else { $patch = 0; $minor++ }
          }

          $newVersion = "$major.$minor.$patch"
          Set-Content -Path VERSION -Value $newVersion -NoNewline
          Write-Host "New version: $newVersion"
          echo "version=$newVersion" >> $env:GITHUB_OUTPUT
          echo "tag=v$newVersion" >> $env:GITHUB_OUTPUT

      # Save the bumped VERSION back to the repo so the next run starts from
      # the right number. "[skip ci]" stops this commit from triggering the
      # workflow again (infinite loop).
      - name: Commit bumped VERSION back to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add VERSION
          git commit -m "Bump version to ${{ steps.appver.outputs.version }} [skip ci]"
          git push origin HEAD:${{ github.ref_name }}

      - name: Build with PyInstaller (onedir)
        run: >
          pyinstaller --noconfirm --clean --onedir --windowed
          --name GameVault
          --icon=icon.ico
          --add-data "VERSION;."
          --hidden-import=win32com.client
          --hidden-import=pythoncom
          --hidden-import=pywintypes
          --collect-all webview
          GameVault_app.py

      # Fail the build if VERSION didn't make it into the bundle -- otherwise
      # the app ships showing 0.0.0 and in-app updates never work.
      - name: Verify VERSION is bundled
        shell: pwsh
        run: |
          if (-not ((Test-Path "dist/GameVault/_internal/VERSION") -or (Test-Path "dist/GameVault/VERSION"))) {
            Write-Error "VERSION was not bundled into dist/GameVault"
            exit 1
          }
          Get-ChildItem -Recurse dist/GameVault -Filter VERSION | ForEach-Object { Write-Host "Found: $($_.FullName)" }

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Build installer with Inno Setup
        run: |
          mkdir installer
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=${{ steps.appver.outputs.version }}" "GameVault.iss"

      - name: Upload installer as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: GameVault_Setup
          path: installer\GameVault_Setup.exe

      # Safety net: with the auto-bump above this should always be a fresh
      # version, but if a release for this tag somehow already exists (e.g.
      # a manual re-run), skip publishing again instead of erroring out or
      # silently overwriting it.
      - name: Check if this version was already released
        id: check_release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${{ steps.appver.outputs.tag }}" --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) {
            echo "exists=true" >> $env:GITHUB_OUTPUT
          } else {
            echo "exists=false" >> $env:GITHUB_OUTPUT
          }
          exit 0

      # This is what GameVault_app.py's check_for_update() actually polls
      # (GitHub Releases API, "latest"), and what it downloads the .exe
      # from -- an artifact upload alone is not enough for in-app updates.
      - name: Publish GitHub Release
        if: steps.check_release.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.appver.outputs.tag }}
          name: GameVault ${{ steps.appver.outputs.version }}
          generate_release_notes: true
          files: installer/GameVault_Setup.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
